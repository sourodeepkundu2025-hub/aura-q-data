name: Validate research data

on:
  push:
    branches: [main, codex/aura-q-data-v1]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "data/**"
      - "DATA_MANIFEST.json"
      - "pyproject.toml"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # official v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test validation and analysis
        run: python -m unittest discover -s tests -v
      - name: Validate frozen files and reconstruct table points
        run: python scripts/auraq.py validate --table-checks
